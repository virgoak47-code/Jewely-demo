<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Moon&sun</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; background: #0f172a; border-radius: 16px; border: 1px solid #1e293b; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Header */
        .app-header { background: #1e293b; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .app-title { font-size: 0.95rem; font-weight: bold; color: #38bdf8; }
        .nav-buttons button { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .nav-buttons button.active { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8; }

        /* Views */
        .view-section { display: none; padding: 15px; }
        .view-section.active { display: block; }

        /* POS Styles */
        .card { background: #121824; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .card-title { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: bold; }
        
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 0.9rem; margin-bottom: 8px; }
        
        .btn-primary { background: #22c55e; color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn-outline { background: transparent; border: 1px dashed #38bdf8; color: #38bdf8; padding: 8px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-secondary { background: #334155; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.85rem; }

        .ticket-list { min-height: 80px; max-height: 140px; overflow-y: auto; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 5px; }
        .ticket-item { display: flex; justify-content: space-between; margin-bottom: 6px; }

        .total-box { display: flex; justify-content: space-between; align-items: center; background: #0b0f19; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .total-amount { font-size: 1.4rem; font-weight: bold; color: #4ade80; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        /* Cash summary */
        .cash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-bottom: 8px; }
        .cash-box { background: #0b0f19; padding: 8px; border-radius: 6px; }
        .cash-box span { display: block; font-size: 0.7rem; color: #94a3b8; }
        .cash-box strong { font-size: 0.9rem; color: #38bdf8; }

        /* Inventory Entry Styles */
        .renglon-item { background: #161e2e; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #1e293b; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- HEADER Y NAVEGACIÓN -->
    <div class="app-header">
        <div class="app-title">🌙✨ Moon&sun</div>
        <div class="nav-buttons">
            <button id="btnTabVenta" class="active" onclick="cambiarVista('venta')">Venta</button>
            <button id="btnTabEntrada" onclick="cambiarVista('entrada')">+ Mercancía</button>
        </div>
    </div>

    <!-- VISTA 1: PUNTO DE VENTA -->
    <div id="vistaVenta" class="view-section active">
        <!-- Escáner / Entrada -->
        <div class="card">
            <div class="card-title">Búsqueda / Código</div>
            <button class="btn-secondary" style="margin-bottom: 8px;" onclick="simularEscaneo()">📷 Escanear Pieza</button>
            <input type="text" id="codigoBarrasInput" placeholder="Código o SKU de la joya..." onkeypress="if(event.key === 'Enter') agregarAlTicket()">
            <input type="text" id="buscarNombreInput" placeholder="Buscar por tipo, talla o medida..." oninput="filtrarCatalogo()">
        </div>

        <!-- Ticket de Compra -->
        <div class="card">
            <div class="card-title" style="display: flex; justify-content: space-between;">
                <span>Ticket de Venta</span>
                <span style="color: #f87171; cursor: pointer;" onclick="vaciarTicket()">Vaciar</span>
            </div>
            <div id="ticketContenido" class="ticket-list">
                <div style="color: #64748b; text-align: center; padding: 20px;">Ticket vacío. Selecciona o escanea una pieza.</div>
            </div>
            <div class="total-box">
                <span style="color: #94a3b8; font-size: 0.85rem;">TOTAL:</span>
                <span id="totalVenta" class="total-amount">$0.00</span>
            </div>
            <div class="grid-2">
                <div>
                    <label style="font-size: 0.75rem; color: #94a3b8;">Efectivo ($)</label>
                    <input type="number" id="pagoEfectivo" value="0.00" oninput="calcularCambio()">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #94a3b8;">Cambio ($)</label>
                    <input type="text" id="cambioDevolver" value="$0.00" disabled style="color: #38bdf8; font-weight: bold;">
                </div>
            </div>
            <button class="btn-primary" onclick="finalizarCobro()">✓ Finalizar y Cobrar</button>
        </div>

        <!-- Caja del Día -->
        <div class="card" style="margin-bottom: 0;">
            <div class="card-title">Caja del Día (<span id="fechaHoy"></span>)</div>
            <div class="cash-grid">
                <div class="cash-box">
                    <span>Tickets</span>
                    <strong id="cajaTickets">0</strong>
                </div>
                <div class="cash-box">
                    <span>Efectivo</span>
                    <strong id="cajaEfectivo">$0.00</strong>
                </div>
                <div class="cash-box">
                    <span>Ventas</span>
                    <strong id="cajaVentas">$0.00</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA 2: ENTRADA DE MERCANCÍA -->
    <div id="vistaEntrada" class="view-section">
        <div class="card">
            <div class="card-title">📦 Registrar Entrada de Proveedor</div>
            <div class="grid-2">
                <div>
                    <label style="font-size: 0.75rem; color: #94a3b8;">Proveedor</label>
                    <input type="text" id="inputProveedor" placeholder="Ej. Mayorista Acero">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #94a3b8;">Fecha</label>
                    <input type="date" id="inputFecha">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Artículos en la Nota</div>
            <div id="listaProductosEntrada">
                <!-- Renglón inicial -->
                <div class="renglon-item">
                    <input type="text" placeholder="Modelo / Talla / Medida (Ej. Anillo T7)" class="ent-nombre" style="margin-bottom: 6px;">
                    <div class="grid-2">
                        <input type="number" placeholder="Cant." class="ent-cant" oninput="calcularInversionTotal()">
                        <input type="number" placeholder="Costo ($)" class="ent-costo" oninput="calcularInversionTotal()">
                    </div>
                </div>
            </div>
            <button class="btn-outline" onclick="agregarRenglónEntrada()">+ Agregar otro producto</button>
        </div>

        <div class="card">
            <div class="total-box">
                <span style="color: #94a3b8; font-size: 0.85rem;">Inversión Total:</span>
                <span id="lblInversionTotal" class="total-amount" style="font-size: 1.1rem;">$0.00</span>
            </div>
            <button class="btn-primary" onclick="guardarEntradaMercancia()" style="background: #2563eb;">Guardar y Actualizar Stock</button>
        </div>
    </div>
</div>

<script>
    // Inicialización de fechas
    const fechaActual = new Date().toISOString().split('T')[0];
    document.getElementById('fechaHoy').innerText = new Date().toLocaleDateString();
    document.getElementById('inputFecha').value = fechaActual;

    // Estado global simulado
    let carrito = [];
    let cajaData = { tickets: 0, efectivo: 0, ventas: 0 };

    // Control de Vistas
    function cambiarVista(vista) {
        if(vista === 'venta') {
            document.getElementById('vistaVenta').classList.add('active');
            document.getElementById('vistaEntrada').classList.remove('active');
            document.getElementById('btnTabVenta').classList.add('active');
            document.getElementById('btnTabEntrada').classList.remove('active');
        } else {
            document.getElementById('vistaEntrada').classList.add('active');
            document.getElementById('vistaVenta').classList.remove('active');
            document.getElementById('btnTabEntrada').classList.add('active');
            document.getElementById('btnTabVenta').classList.remove('active');
        }
    }

    // Lógica de Venta y Ticket
    function simularEscaneo() {
        const productoDemo = { nombre: "Anillo Acero Clásico T7", precio: 150.00 };
        agregarAlCarritoDirecto(productoDemo);
    }

    function agregarAlTicket() {
        const input = document.getElementById('codigoBarrasInput');
        if(!input.value) return;
        
        const productoDemo = { nombre: `Pieza SKU: ${input.value}`, precio: 200.00 };
        agregarAlCarritoDirecto(productoDemo);
        input.value = '';
    }

    function agregarAlCarritoDirecto(prod) {
        carrito.push(prod);
        actualizarVistaTicket();
    }

    function actualizarVistaTicket() {
        const contenedor = document.getElementById('ticketContenido');
        if(carrito.length === 0) {
            contenedor.innerHTML = `<div style="color: #64748b; text-align: center; padding: 20px;">Ticket vacío. Selecciona o escanea una pieza.</div>`;
            document.getElementById('totalVenta').innerText = '$0.00';
            return;
        }

        let html = '';
        let total = 0;
        carrito.forEach((item, index) => {
            total += item.precio;
            html += `<div class="ticket-item"><span>${item.nombre}</span> <strong>$${item.precio.toFixed(2)}</strong></div>`;
        });
        contenedor.innerHTML = html;
        document.getElementById('totalVenta').innerText = `$${total.toFixed(2)}`;
        calcularCambio();
    }

    function vaciarTicket() {
        carrito = [];
        actualizarVistaTicket();
    }

    function calcularCambio() {
        let total = carrito.reduce((acc, item) => acc + item.precio, 0);
        let efectivo = parseFloat(document.getElementById('pagoEfectivo').value) || 0;
        let cambio = efectivo - total;
        document.getElementById('cambioDevolver').value = cambio >= 0 ? `$${cambio.toFixed(2)}` : '$0.00';
    }

    function finalizarCobro() {
        let total = carrito.reduce((acc, item) => acc + item.precio, 0);
        if(total <= 0) {
            alert("El ticket está vacío.");
            return;
        }

        let efectivo = parseFloat(document.getElementById('pagoEfectivo').value) || 0;
        if(efectivo < total) {
            alert("El efectivo es menor al total de la compra.");
            return;
        }

        cajaData.tickets += 1;
        cajaData.efectivo += total;
        cajaData.ventas += total;

        document.getElementById('cajaTickets').innerText = cajaData.tickets;
        document.getElementById('cajaEfectivo').innerText = `$${cajaData.efectivo.toFixed(2)}`;
        document.getElementById('cajaVentas').innerText = `$${cajaData.ventas.toFixed(2)}`;

        alert("¡Venta cobrada con éxito en Moon&sun!");
        vaciarTicket();
        document.getElementById('pagoEfectivo').value = '0.00';
    }

    // Lógica de Entrada de Mercancía
    function agregarRenglónEntrada() {
        const contenedor = document.getElementById('listaProductosEntrada');
        const nuevoDiv = document.createElement('div');
        nuevoDiv.className = 'renglon-item';
        nuevoDiv.innerHTML = `
            <input type="text" placeholder="Modelo / Talla / Medida" class="ent-nombre" style="margin-bottom: 6px;">
            <div class="grid-2">
                <input type="number" placeholder="Cant." class="ent-cant" oninput="calcularInversionTotal()">
                <input type="number" placeholder="Costo ($)" class="ent-costo" oninput="calcularInversionTotal()">
            </div>
        `;
        contenedor.appendChild(nuevoDiv);
    }

    function calcularInversionTotal() {
        let totalInversion = 0;
        const renglones = document.querySelectorAll('.renglon-item');
        renglones.forEach(r => {
            const cant = parseFloat(r.querySelector('.ent-cant').value) || 0;
            const costo = parseFloat(r.querySelector('.ent-costo').value) || 0;
            totalInversion += (cant * costo);
        });
        document.getElementById('lblInversionTotal').innerText = `$${totalInversion.toFixed(2)}`;
    }

    function guardarEntradaMercancia() {
        const proveedor = document.getElementById('inputProveedor').value;
        if(!proveedor) {
            alert("Por favor ingresa el nombre del proveedor.");
            return;
        }
        alert("¡Entrada de mercancía registrada y stock actualizado en Moon&sun!");
        cambiarVista('venta');
    }
</script>

</body>
</html>
