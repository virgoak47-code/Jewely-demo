<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Punto de Venta - Moon&sun</title><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{background:#0b0f19;color:#f8fafc;padding:15px;display:flex;justify-content:center}.app{width:100%;max-width:480px;background:#0f172a;border:1px solid #1e293b;border-radius:16px;overflow:hidden;box-shadow:0 10px 25px #0008}.head{background:#1e293b;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}.title{font-weight:bold;color:#38bdf8}.nav{display:flex;gap:5px}.nav button,.btn2{background:#0f172a;border:1px solid #334155;color:#cbd5e1;padding:8px 10px;border-radius:7px;font-weight:bold}.nav .active{background:#38bdf8;color:#0f172a}.view{display:none;padding:15px}.view.active{display:block}.card{background:#121824;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-bottom:12px}.ct{font-size:.8rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:bold}label{font-size:.75rem;color:#94a3b8;display:block;margin:5px 0 4px}input{width:100%;padding:12px;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:7px;font-size:.9rem;margin-bottom:6px}input:focus{outline:none;border-color:#38bdf8}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#22c55e;color:white;font-weight:bold;font-size:.95rem}.btnblue{background:#2563eb}.btn2{width:100%;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{display:none;padding:9px;border-radius:7px;background:#172033;color:#fcd34d;font-size:.8rem;text-align:center;margin:7px 0}.results{max-height:250px;overflow:auto}.item{background:#161e2e;border:1px solid #334155;border-radius:8px;padding:10px;margin:7px 0}.row{display:flex;justify-content:space-between;gap:8px}.price,.green{color:#4ade80;font-weight:bold}.small{font-size:.72rem;color:#94a3b8;margin-top:4px}.ticket{min-height:80px;max-height:220px;overflow:auto;border-bottom:1px solid #1e293b;padding-bottom:5px}.total{display:flex;justify-content:space-between;background:#0b0f19;padding:10px;border-radius:6px;margin:10px 0}.total strong{font-size:1.4rem;color:#4ade80}.cash{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cash div{background:#0b0f19;padding:8px;border-radius:6px;text-align:center}.cash span,.cash b{display:block}.cash span{font-size:.7rem;color:#94a3b8}.cash b{color:#38bdf8}.entry{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px}.empty{text-align:center;color:#64748b;padding:18px;font-size:.82rem}.remove{color:#f87171;font-size:.7rem;cursor:pointer}#reader{display:none;background:#000;border-radius:8px;overflow:hidden;margin:8px 0}#reader video{width:100%!important;height:auto!important}
</style></head><body><div class="app"><div class="head"><div class="title">🌙✨ Moon&sun</div><div class="nav"><button id="ventaTab" class="active">Venta</button><button id="entradaTab">+ Mercancía</button></div></div>
<section id="venta" class="view active"><div class="card"><div class="ct">Escáner de Código</div><button id="cam" class="btn2">📷 Encender Cámara</button><div id="reader"></div><div id="status" class="msg">📷 Buscando código...</div><div id="msg" class="msg"></div><label>Código o SKU</label><input id="codigo" placeholder="Escribe o escanea el código..." autocomplete="off"><label>Buscar en inventario</label><input id="buscar" placeholder="Nombre, tipo, talla, medida o SKU..." autocomplete="off"><div id="resultados" class="results"></div></div>
<div class="card"><div class="ct row"><span>Ticket de Venta</span><span id="vaciar" style="color:#f87171;cursor:pointer">VACIAR</span></div><div id="ticket" class="ticket"></div><div class="total"><span>TOTAL:</span><strong id="total">$0.00</strong></div><div class="grid"><div><label>Efectivo ($)</label><input id="efectivo" type="number" min="0" step=".01" value="0.00"></div><div><label>Cambio ($)</label><input id="cambio" value="$0.00" disabled style="color:#38bdf8;font-weight:bold"></div></div><button id="cobrar" class="btn">✓ Finalizar y Cobrar</button></div>
<div class="card"><div class="ct">Caja del Día (<span id="fecha"></span>)</div><div class="cash"><div><span>Tickets</span><b id="tickets">0</b></div><div><span>Efectivo</span><b id="efCaja">$0.00</b></div><div><span>Ventas</span><b id="ventas">$0.00</b></div></div></div></section>
<section id="entrada" class="view"><div class="card"><div class="ct">📦 Registrar Entrada de Proveedor</div><div class="grid"><div><label>Proveedor</label><input id="proveedor" placeholder="Ej. Proveedor"></div><div><label>Fecha</label><input id="fechaEntrada" type="date"></div></div></div><div class="card"><div class="ct">Agregar producto a la nota</div><div class="entry"><label>Código / SKU</label><input id="sku" placeholder="Ej. 7702031311218"><label>Nombre / Modelo</label><input id="nombre" placeholder="Ej. Luna"><div class="grid"><div><label>Cantidad</label><input id="cant" type="number" min="1" value="1"></div><div><label>Costo por pieza</label><input id="costo" type="number" min="0" step=".01" placeholder="50"></div></div><label>Precio de venta por pieza</label><input id="precio" type="number" min="0" step=".01" placeholder="100"><button id="addNota" class="btn2">+ Agregar producto a la nota</button></div></div><div class="card"><div class="ct row"><span>ARTÍCULOS CAPTURADOS</span><span id="contador">0 productos</span></div><div id="listaNota"></div><div class="total"><span>Inversión Total:</span><strong id="inversion">$0.00</strong></div><button id="guardarNota" class="btn btnblue">Guardar y Actualizar Stock</button><button id="limpiarNota" class="btn2" style="margin-top:8px">🗑 Limpiar nota pendiente</button></div><div class="card"><div class="ct">📦 Inventario actual</div><div id="inventario"></div></div></section></div>
<script>
'use strict';
const IK='ms_inv_v5',NK='ms_nota_v5',CK='ms_caja_v5';
const inicial=[{sku:'750101',nombre:'Anillo Ajustable Zirconia T7',precio:180,costo:0,cantidad:0},{sku:'750102',nombre:'Cadena Eslabón Cubano 50cm',precio:320,costo:0,cantidad:0},{sku:'750103',nombre:'Pulsera Esclava Acero Dama',precio:250,costo:0,cantidad:0},{sku:'750104',nombre:'Arracadas Clásicas 30mm',precio:190,costo:0,cantidad:0}];
const get=(k,d)=>{try{let x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}},set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},money=n=>'$'+Number(n||0).toFixed(2),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let inv=get(IK,null);if(!Array.isArray(inv)){inv=inicial.map(x=>({...x}));set(IK,inv)}let nota=get(NK,[]);if(!Array.isArray(nota))nota=[];let caja=get(CK,null);if(!caja||caja.fecha!==today()){caja={fecha:today(),tickets:0,efectivo:0,ventas:0};set(CK,caja)}let carrito=[],qr=null,camOn=false,busy=false;
const $=id=>document.getElementById(id),findSku=s=>inv.find(p=>String(p.sku).trim().toLowerCase()===String(s).trim().toLowerCase());
function msg(t,type=''){let e=$('msg');e.className='msg';e.style.display='block';e.style.color=type==='ok'?'#86efac':type==='err'?'#fca5a5':'#fcd34d';e.textContent=t;clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3500)}
function tab(v){if(camOn)stopCam();$('venta').classList.toggle('active',v==='venta');$('entrada').classList.toggle('active',v!=='venta');$('ventaTab').classList.toggle('active',v==='venta');$('entradaTab').classList.toggle('active',v!=='venta');if(v!=='venta'){renderNota();renderInv()}}
function search(){let q=$('buscar').value.trim().toLowerCase(),r=$('resultados');if(!q){r.innerHTML='<div class="empty">Escribe nombre, tipo, talla, medida o SKU para buscar.</div>';return}let a=inv.filter(p=>String(p.sku).toLowerCase().includes(q)||String(p.nombre).toLowerCase().includes(q)).slice(0,30);if(!a.length){r.innerHTML='<div class="empty">⚠️ No se encontró ese artículo.</div>';return}r.innerHTML=a.map(p=>`<div class="item"><div class="row"><div><b>${safe(p.nombre)}</b><div class="small">SKU: ${safe(p.sku)} · Stock: ${Number(p.cantidad)||0}</div></div><span class="price">${money(p.precio)}</span></div><button class="btn2 add" data-sku="${safe(p.sku)}" style="margin-top:8px">+ Agregar al ticket</button></div>`).join('');r.querySelectorAll('.add').forEach(b=>b.onclick=()=>addTicket(b.dataset.sku))}
function addTicket(sku){let p=findSku(sku);if(!p)return;let stock=Number(p.cantidad)||0;if(stock<=0){msg('⚠️ Ese artículo no tiene existencias.');return}let x=carrito.find(i=>String(i.sku)===String(p.sku));if((x?.cantidad||0)>=stock){msg('⚠️ Ya agregaste todo el stock disponible.');return}if(x)x.cantidad++;else carrito.push({sku:p.sku,nombre:p.nombre,precio:Number(p.precio)||0,cantidad:1});renderTicket();msg('✓ '+p.nombre+' agregado al ticket','ok')}
function addByInput(){let s=$('codigo').value.trim();if(!s)return;let p=findSku(s);if(!p){msg('⚠️ Ese código no está registrado.');return}addTicket(p.sku);$('codigo').value='';$('codigo').focus()}
function renderTicket(){let e=$('ticket');if(!carrito.length){e.innerHTML='<div class="empty">Ticket vacío. Escanea o busca una pieza.</div>';$('total').textContent='$0.00';calc();return}let total=0;e.innerHTML=carrito.map((x,i)=>{let sub=x.precio*x.cantidad;total+=sub;return `<div class="item row"><div><b>${safe(x.nombre)}</b><div class="small">SKU: ${safe(x.sku)} · Cant.: ${x.cantidad}</div></div><div style="text-align:right"><b>${money(sub)}</b><br><span class="remove" data-i="${i}">Quitar</span></div></div>`}).join('');e.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(carrito[i].cantidad>1)carrito[i].cantidad--;else carrito.splice(i,1);renderTicket()});$('total').textContent=money(total);calc()}
function calc(){let t=carrito.reduce((s,x)=>s+x.precio*x.cantidad,0),p=Number($('efectivo').value)||0;$('cambio').value=p>=t?money(p-t):'$0.00'}
function clearTicket(){carrito=[];$('efectivo').value='0.00';renderTicket()}
function cobrar(){let total=carrito.reduce((s,x)=>s+x.precio*x.cantidad,0),p=Number($('efectivo').value)||0;if(!total)return alert('El ticket está vacío.');if(p<total)return alert('El efectivo es menor al total.');for(let x of carrito){let z=findSku(x.sku);if(!z||Number(z.cantidad)<x.cantidad)return alert('Stock insuficiente: '+x.nombre)}carrito.forEach(x=>findSku(x.sku).cantidad-=x.cantidad);caja.tickets++;caja.efectivo+=p;caja.ventas+=total;set(IK,inv);set(CK,caja);alert('Venta realizada.\nTotal: '+money(total)+'\nCambio: '+money(p-total));clearTicket();renderCaja();renderInv();search()}
function renderCaja(){$('fecha').textContent=new Date().toLocaleDateString('es-MX');$('tickets').textContent=caja.tickets;$('efCaja').textContent=money(caja.efectivo);$('ventas').textContent=money(caja.ventas)}
function addNota(){let sku=$('sku').value.trim(),nombre=$('nombre').value.trim(),cant=Number($('cant').value),costo=Number($('costo').value),precio=Number($('precio').value);if(!sku||!nombre||cant<=0||costo<0||precio<0)return alert('Completa todos los campos.');nota.push({sku,nombre,cantidad:cant,costo,precio});set(NK,nota);['sku','nombre','costo','precio'].forEach(id=>$(id).value='');$('cant').value='1';renderNota();$('sku').focus()}
function renderNota(){let e=$('listaNota');$('contador').textContent=nota.length+' producto'+(nota.length===1?'':'s');if(!nota.length){e.innerHTML='<div class="empty">Todavía no has capturado productos.</div>';$('inversion').textContent='$0.00';return}let t=0;e.innerHTML=nota.map((x,i)=>{let s=x.costo*x.cantidad;t+=s;return `<div class="item"><div class="row"><b>${safe(x.nombre)}</b><span class="remove del" data-i="${i}">Eliminar</span></div><div class="small">SKU: ${safe(x.sku)} · Cantidad: ${x.cantidad}<br>Costo: ${money(x.costo)} · Venta: ${money(x.precio)}</div><div class="green" style="margin-top:5px">Subtotal: ${money(s)}</div></div>`}).join('');e.querySelectorAll('.del').forEach(b=>b.onclick=()=>{nota.splice(+b.dataset.i,1);set(NK,nota);renderNota()});$('inversion').textContent=money(t)}
function saveNota(){if(!nota.length)return alert('No hay productos capturados.');nota.forEach(x=>{let p=findSku(x.sku);if(p){p.cantidad=(Number(p.cantidad)||0)+x.cantidad;p.costo=x.costo;p.precio=x.precio;p.nombre=x.nombre}else inv.push({sku:x.sku,nombre:x.nombre,precio:x.precio,costo:x.costo,cantidad:x.cantidad})});set(IK,inv);nota=[];set(NK,nota);renderNota();renderInv();search();alert('Mercancía guardada y stock actualizado.')}
function renderInv(){$('inventario').innerHTML=inv.length?inv.map(p=>`<div class="item"><div class="row"><b>${safe(p.nombre)}</b><b class="price">${money(p.precio)}</b></div><div class="small">SKU: ${safe(p.sku)} · Stock: ${Number(p.cantidad)||0} · Costo: ${money(p.costo)}</div></div>`).join(''):'<div class="empty">Inventario vacío.</div>'}
async function startCam(){if(!window.Html5Qrcode)return msg('⚠️ No cargó el lector. Revisa internet.','err');if(!window.isSecureContext&&location.hostname!=='localhost')return msg('⚠️ La cámara requiere HTTPS.','err');try{qr=new Html5Qrcode('reader');$('reader').style.display='block';$('status').style.display='block';$('cam').textContent='⏹️ Apagar Cámara';camOn=true;await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:120}},text=>{if(busy)return;busy=true;$('codigo').value=text;let p=findSku(text);if(p){addTicket(p.sku);$('codigo').value=''}else msg('⚠️ Código '+text+' no existe en inventario.');setTimeout(()=>busy=false,1200)},()=>{})}catch(e){console.error(e);camOn=false;$('reader').style.display='none';$('status').style.display='none';$('cam').textContent='📷 Encender Cámara';msg('⚠️ No se pudo activar la cámara. Revisa el permiso del navegador.','err')}}
async function stopCam(){try{if(qr){await qr.stop();qr.clear()}}catch(e){}qr=null;camOn=false;$('reader').style.display='none';$('status').style.display='none';$('cam').textContent='📷 Encender Cámara'}
$('ventaTab').onclick=()=>tab('venta');$('entradaTab').onclick=()=>tab('entrada');$('cam').onclick=()=>camOn?stopCam():startCam();$('codigo').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addByInput()}};$('buscar').oninput=search;$('efectivo').oninput=calc;$('vaciar').onclick=clearTicket;$('cobrar').onclick=cobrar;$('addNota').onclick=addNota;$('guardarNota').onclick=saveNota;$('limpiarNota').onclick=()=>{if(nota.length&&confirm('¿Limpiar la nota pendiente?')){nota=[];set(NK,nota);renderNota()}};
renderCaja();renderTicket();renderNota();renderInv();search();$('fechaEntrada').value=today();
</script></body></html>
